[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "threadroot"
version = "0.1.0"
description = "Local-first second-brain workflows for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Threadroot contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Will413028/threadroot"
Repository = "https://github.com/Will413028/threadroot"
Issues = "https://github.com/Will413028/threadroot/issues"

[project.scripts]
threadroot = "threadroot.cli:main"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["src/threadroot"]

[tool.hatch.build.targets.sdist]
only-include = [
  ".claude-plugin",
  ".codex-plugin",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "docs",
  "scripts",
  "skills",
  "src/threadroot",
  "templates",
  "tests",
]
